apiVersion: apps/v1
kind: Deployment
metadata:
  name: taketransit
  namespace: bmt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taketransit
  template:
    metadata:
      labels:
        app: taketransit
    spec:
      containers:
      - image: ghcr.io/berkeleymt/taketransit:latest
        name: taketransit
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 16Mi
      imagePullSecrets:
      - name: ghcr-auth
