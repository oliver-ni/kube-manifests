apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  name: taketransit-ingress
  namespace: bmt
spec:
  rules:
  - host: taketransit.berkeley.mt
    http:
      paths:
      - backend:
          service:
            name: taketransit
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - taketransit.berkeley.mt
    secretName: taketransit-ingress-tls
